<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>COSMOLUCAS</title>
<meta name="description" content="El juego de plataformas espacial de Lucas. Un juego de FuturMovil.">
<meta name="theme-color" content="#070a1e">
<meta property="og:type" content="website">
<meta property="og:title" content="COSMOLUCAS">
<meta property="og:description" content="Viaja con el robot Lucas por 10 planetas. ¡Juega gratis!">
<meta property="og:url" content="https://puntofibra.github.io/turbolucas/?c=cosmo10">
<meta property="og:image" content="https://puntofibra.github.io/turbolucas/img/og2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon/icon-32.png?v=2">
<link rel="apple-touch-icon" href="img/icon/icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--cy:#29e6ff;--mg:#c63cff;--gr:#35ff8a;--bg:#070a1e}
*{touch-action:none;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;width:100%;position:fixed;inset:0;-webkit-text-size-adjust:100%;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;padding:16px;text-align:center}
.ov.on{display:flex}
#title{background:linear-gradient(180deg,rgba(7,10,30,.35),rgba(7,10,30,.78))}
#title .logo{width:min(78vw,620px);max-height:26vh;object-fit:contain;filter:drop-shadow(0 0 16px rgba(53,255,138,.45));position:relative;z-index:1}
#heroFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#title>*:not(#heroFx){position:relative;z-index:1}
#title>#ver.ver{position:fixed}
#title .hero{height:min(30vh,290px);margin:1vh 0;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 12px 22px rgba(41,230,255,.35))}
@keyframes bob{50%{transform:translateY(-10px)}}
.btn{font:inherit;font-weight:800;letter-spacing:.06em;color:#fff;border:2px solid var(--cy);background:rgba(12,20,52,.82);border-radius:14px;padding:12px 22px;cursor:pointer;box-shadow:0 0 14px rgba(41,230,255,.45),inset 0 0 12px rgba(41,230,255,.18);transition:transform .08s}
.btn:active{transform:scale(.95)}
.btn.big{font-size:clamp(20px,4.2vh,30px);padding:14px 54px;border-color:var(--gr);box-shadow:0 0 20px rgba(53,255,138,.6),inset 0 0 14px rgba(53,255,138,.25);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 34px rgba(53,255,138,.9),inset 0 0 18px rgba(53,255,138,.35)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.row .btn{font-size:14px;padding:9px 14px}
.credit{margin-top:12px;font-size:12px;letter-spacing:.22em;color:#9fb4ff;text-shadow:0 0 8px rgba(120,150,255,.7)}
.ver{position:fixed;right:8px;bottom:6px;font-size:10px;color:#56659c}
#panel{background:rgba(5,8,24,.8);backdrop-filter:blur(3px)}
.card{background:rgba(14,20,52,.95);border:2px solid var(--cy);border-radius:18px;padding:18px 26px;min-width:min(86vw,360px);max-width:92vw;box-shadow:0 0 30px rgba(41,230,255,.4)}
.card h2{margin:0 0 6px;font-size:clamp(22px,5vh,34px);letter-spacing:.05em;text-shadow:0 0 14px var(--cy)}
.stars{font-size:clamp(34px,8vh,54px);letter-spacing:8px;margin:4px 0}
.stars span{color:#2b345e;transition:all .3s}
.stars span.on{color:#ffd23c;text-shadow:0 0 18px #ffb400}
.stat{display:flex;justify-content:space-between;gap:30px;font-size:15px;padding:3px 0;color:#cfe0ff}
.stat b{color:#fff}
.small{font-size:12px;color:#8ea3e6;margin-top:8px}
#rot{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:60;background:radial-gradient(circle at 50% 35%,#1a1f5c,#070a1e 70%);display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
#rot.on{display:flex}
#rot .rbox{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:340px;margin:0 auto}
#rot img{height:min(34vh,230px);width:auto;transform-origin:50% 55%;animation:mareo 2.4s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(41,230,255,.5))}
@keyframes mareo{0%,15%{transform:rotate(0)}45%,70%{transform:rotate(90deg)}85%,100%{transform:rotate(0)}}
#rot h2{margin:18px 0 6px;font-size:26px;letter-spacing:.04em;text-shadow:0 0 14px var(--cy)}
#rot p{margin:0;font-size:16px;line-height:1.45;color:#cfe0ff}
#rot p b{color:var(--gr)}
#rot .ph{width:38px;height:66px;border:3px solid var(--cy);border-radius:9px;margin-top:20px;animation:rot 2.4s ease-in-out infinite;box-shadow:0 0 14px rgba(41,230,255,.5)}
@keyframes rot{0%,15%{transform:rotate(0)}45%,70%{transform:rotate(90deg)}85%,100%{transform:rotate(0)}}
#mapUI{position:fixed;right:16px;bottom:12px;right:calc(16px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:8;display:none;flex-direction:column;align-items:flex-end;text-align:right;pointer-events:none;max-width:60vw}
#mapUI.on{display:flex}
#mapUI>*{pointer-events:auto}
#mTitle{font-weight:800;font-size:clamp(15px,3.6vh,22px);letter-spacing:.05em;text-shadow:0 0 12px rgba(41,230,255,.8),0 2px 4px #000}
#mSub{font-size:clamp(12px,2.6vh,15px);color:#cfe0ff;margin-top:2px;text-shadow:0 2px 4px #000;font-weight:600}
#mSub .mst{color:#ffd23c}#mSub .mso{color:#4a5488}
#mapUI .row{margin-top:8px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
#mapUI .btn.big{font-size:clamp(17px,3.6vh,24px);padding:10px 44px}
#mPlay:disabled{opacity:.45;animation:none;border-color:#6b739a;box-shadow:none;cursor:default}
#rotBtn{display:none;margin-top:18px;font-size:16px;border-color:var(--gr);box-shadow:0 0 16px rgba(53,255,138,.55),inset 0 0 12px rgba(53,255,138,.2)}
#rotBtn.on{display:inline-block}
#rotHint{display:none;margin-top:16px;padding:12px 16px 14px;border:2px solid #ffb400;border-radius:16px;background:rgba(58,36,0,.6);box-shadow:0 0 20px rgba(255,180,0,.5);animation:aviso 1.3s ease-in-out infinite}
#rotHint.on{display:block}
#rot.hint img{height:min(20vh,140px)}
#rot.hint .ph{display:none}
#rotHint h3{margin:4px 0 6px;font-size:19px;color:#ffd23c;letter-spacing:.03em}
#rotHint p{font-size:15px;color:#fff3d0}
#rotHint p b{color:#ffd23c}
@keyframes aviso{50%{box-shadow:0 0 34px rgba(255,180,0,.85);transform:scale(1.02)}}
#touch{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
#touch.on{display:block}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(41,230,255,.75);background:rgba(12,20,52,.42);color:#dff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 12px rgba(41,230,255,.35)}
.tb.dn{background:rgba(41,230,255,.42);transform:scale(.94)}
#bL{left:calc(14px + env(safe-area-inset-left));bottom:calc(22px + var(--tpl,0vh));width:76px;height:76px}
#bR{left:calc(102px + env(safe-area-inset-left));bottom:calc(22px + var(--tpl,0vh));width:76px;height:76px}
#bD{left:calc(58px + env(safe-area-inset-left));bottom:calc(106px + var(--tpl,0vh));width:56px;height:56px;font-size:18px}
#bA{right:calc(14px + env(safe-area-inset-right));bottom:calc(22px + var(--tpr,0vh));width:92px;height:92px;border-color:rgba(53,255,138,.85);font-size:15px}
#bB{right:calc(116px + env(safe-area-inset-right));bottom:calc(22px + var(--tpr,0vh));width:68px;height:68px;border-color:rgba(198,60,255,.85);font-size:13px}
#top{position:fixed;top:14px;right:8px;top:calc(14px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:6;display:none;gap:8px}
#top.on{display:flex}
#top .btn{padding:8px 13px;font-size:15px;border-radius:10px;touch-action:manipulation}
#ios{z-index:40;background:rgba(5,8,24,.9)}
#ios .card{font-size:15px;line-height:1.5}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title" class="ov on">
  <img class="logo" id="logoImg" alt="COSMOLUCAS">
  <img class="hero" id="heroImg" alt="Lucas">
  <button class="btn big" id="btnPlay">JUGAR</button>
  <div class="row">
    <button class="btn" id="btnTips" style="display:none">CONSEJOS</button>
    <button class="btn" id="btnRank" style="border-color:#ffd23c">🏆 RANKING</button>
    <button class="btn" id="btnTaller" style="border-color:#c63cff">🛠️ TALLER</button>
    <button class="btn" id="btnInstall">INSTALAR</button>
    <button class="btn" id="btnShare">COMPARTIR</button>
    <button class="btn" id="btnCfg">⚙️ AJUSTES</button><button class="btn" id="btnSnd" style="display:none">SONIDO: SÍ</button>
    <button class="btn" id="btnFull" style="display:none">PANTALLA COMPLETA</button>
    <button class="btn" id="btnWeb" style="border-color:#ffd23c;box-shadow:0 0 14px rgba(255,210,60,.45),inset 0 0 12px rgba(255,210,60,.18)">WEB DEL CREADOR</button>
  </div>
  <div class="credit">UN JUEGO DE FUTURMOVIL</div>
  <div class="ver" id="ver"></div>
</div>

<div id="mapUI">
  <div id="mTitle"></div><div id="mSub"></div>
  <div class="row"><button class="btn" id="mBack">VOLVER</button><button class="btn big" id="mPlay">JUGAR</button></div>
</div>

<div id="top">
  <button class="btn" id="btnMute" aria-label="Sonido">♪</button>
  <button class="btn" id="btnPause" aria-label="Pausa">II</button>
</div>

<div id="touch">
  <div class="tb" id="bL">◀</div>
  <div class="tb" id="bR">▶</div>
  <div class="tb" id="bD">▼</div>
  <div class="tb" id="bB">LÁSER</div>
  <div class="tb" id="bA">SALTAR</div>
</div>

<div id="panel" class="ov"><div class="card" id="card"></div></div>

<div id="rot"><div class="rbox"><img id="rotImg" alt=""><h2>¡EH, QUE ME MAREO!</h2><p>Lucas no sabe volar de pie.<br><b>Gira el móvil</b> y juega en horizontal.</p><div class="ph"></div>
  <button class="btn" id="rotBtn">GIRAR LA PANTALLA</button>
  <div id="rotHint">
    <svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true"><rect x="10" y="21" width="28" height="21" rx="4" fill="#ffb400"/><path d="M16 21v-6a8 8 0 0 1 16 0v6" fill="none" stroke="#ffb400" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="31" r="3.4" fill="#2a1a00"/></svg>
    <h3 id="rotHintT"></h3>
    <p id="rotHintP"></p>
  </div>
</div></div>

<div id="ios" class="ov"><div class="card">
  <h2>Instalar en iPhone</h2>
  <p>1. Abre esta página en <b>Safari</b>.<br>2. Pulsa el botón <b>Compartir</b> (el cuadrado con la flecha).<br>3. Elige <b>Añadir a pantalla de inicio</b>.</p>
  <button class="btn" id="iosOk">ENTENDIDO</button>
</div></div>

<script src="js/qrcode.min.js"></script>
<script src="game.js?v=124"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {}); }); }
</script>
</body>
</html>
